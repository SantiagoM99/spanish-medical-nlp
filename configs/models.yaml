# Modelos a evaluar en el benchmark

encoders:
  # Modelos BERT-style para fine-tuning supervisado
  - name: bert-base-multilingual-cased
    hf_id: bert-base-multilingual-cased
    type: encoder
  - name: beto
    hf_id: dccuchile/bert-base-spanish-wwm-cased
    type: encoder
  - name: roberta-base-biomedical-es
    hf_id: PlanTL-GOB-ES/roberta-base-biomedical-es
    type: encoder
  - name: roberta-large-biomedical-es
    hf_id: PlanTL-GOB-ES/roberta-large-biomedical-es
    type: encoder
  - name: xlm-roberta-base
    hf_id: xlm-roberta-base
    type: encoder

decoders:
  # Modelos decoder para evaluación zero-shot / few-shot
  - name: Qwen2.5-0.5B-Instruct
    hf_id: Qwen/Qwen2.5-0.5B-Instruct
    type: decoder
    load_in_4bit: false
  - name: Qwen2.5-7B-Instruct
    hf_id: Qwen/Qwen2.5-7B-Instruct
    type: decoder
    load_in_4bit: true
  - name: Llama-3.1-8B-Instruct
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    type: decoder
    load_in_4bit: true
  - name: Mistral-7B-Instruct-v0.3
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    type: decoder
    load_in_4bit: true

peft:
  # Configuración PEFT compartida
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    bias: none
    task_type: CAUSAL_LM
  qlora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    bias: none
    task_type: CAUSAL_LM
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_compute_dtype: float16
  dora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    bias: none
    task_type: CAUSAL_LM
    use_dora: true

training:
  num_epochs: 3
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_ratio: 0.05
  max_seq_length: 512
  fp16: true
  save_strategy: epoch
  evaluation_strategy: epoch
  load_best_model_at_end: true
